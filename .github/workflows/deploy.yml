name: Deploy to GitHub Pages

# Every push to main checks the site, builds it as static HTML and publishes it.
# The build fails (and nothing is published) if a content placeholder or an em
# dash is left anywhere in the site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint and type-check
        run: |
          npm run lint
          npx next typegen
          npm run typecheck

      - name: Build static site
        run: npm run build
        env:
          STRICT_CONTENT: "1"
          NEXT_PUBLIC_SITE_URL: https://daniel-200600.github.io

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
